# Minor and patch updates are grouped into one PR per ecosystem. Major updates
# stay as individual PRs: an AGP, Gradle wrapper or action major version can
# need code or workflow changes and should be reviewed on its own.
#
# The cooldown holds a new release back for a few days before Dependabot
# proposes it, so a compromised or broken release is likely to be yanked
# before it reaches a PR. Security updates are not delayed by the cooldown.

version: 2
updates:
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
      semver-major-days: 14
    groups:
      gradle-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # appcompat 1.8.0+ requires minSdk 23; the app supports minSdk 21.
      # Remove this rule if minSdk is raised to 23 or higher.
      - dependency-name: "androidx.appcompat:appcompat"
        versions: [">= 1.8.0"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
      semver-major-days: 14
    groups:
      github-actions-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: "bundler"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
      semver-major-days: 14
    groups:
      bundler-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
