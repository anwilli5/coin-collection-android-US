# Validates that the Fastlane gem bundle installs and loads on the project's
# pinned Ruby version (.ruby-version), then runs the Fastfile unit tests.
# Catches Ruby/gem incompatibilities that normally show up in the release
# pipelines, plus lane regressions that still parse — a renamed supply option,
# a dropped skip_upload_* guard, a mapping file that stops being attached.
# The job name is a required check; keep it stable.
name: Fastlane Bundle Check

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'Gemfile'
      - 'Gemfile.lock'
      - '.ruby-version'
      - 'fastlane/**'
      - '.github/workflows/**'
  push:
    branches: [ main ]
    paths:
      - 'Gemfile'
      - 'Gemfile.lock'
      - '.ruby-version'
      - 'fastlane/**'
      - '.github/workflows/**'

jobs:
  bundle-check:
    name: Bundle install & Fastlane load
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Ruby for Fastlane
        uses: ruby/setup-ruby@v1
        with:
          # Ruby version defined in .ruby-version
          bundler-cache: true

      - name: Verify Fastlane loads
        run: bundle exec fastlane --version

      - name: Run Fastfile unit tests
        # Drives the real deploy lanes with the store upload actions stubbed,
        # so no credentials or network access are needed.
        run: bundle exec ruby fastlane/test/fastfile_test.rb
