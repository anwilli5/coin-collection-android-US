# separate terms of service, privacy policy, and support
# documentation.

name: DevSkim

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**/*.md'
      - 'images/**'
      - 'fastlane/metadata/**'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**/*.md'
      - 'images/**'
      - 'fastlane/metadata/**'
  schedule:
    - cron: '43 9 * * 3'

jobs:
  lint:
    name: DevSkim
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run DevSkim scanner
        uses: microsoft/DevSkim-Action@v1
        with:
          # DS137138 (http URL) only ever fires on XML namespace declarations such
          # as xmlns:android="http://schemas.android.com/apk/res/android". Those are
          # identifiers that must stay http, and the app makes no network requests.
          exclude-rules: 'DS137138'
          # Severity names are case-sensitive
          extra-options: '--severity Critical,Important'

      - name: Upload DevSkim scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4.38.2
        with:
          sarif_file: devskim-results.sarif
