# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: DevSkim

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**/*.md'
      - 'images/**'
      - 'fastlane/metadata/**'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**/*.md'
      - 'images/**'
      - 'fastlane/metadata/**'
  schedule:
    - cron: '43 9 * * 3'

permissions:
  contents: read

jobs:
  lint:
    name: DevSkim
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run DevSkim scanner
        uses: microsoft/DevSkim-Action@734c6ed89671b1c7a5211ed334c79db261e3f221 # v1
        with:
          # DS137138 (http URL) only ever fires on XML namespace declarations such
          # as xmlns:android="http://schemas.android.com/apk/res/android". Those are
          # identifiers that must stay http, and the app makes no network requests.
          exclude-rules: 'DS137138'
          # Severity names are case-sensitive
          extra-options: '--severity Critical,Important'

      - name: Upload DevSkim scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          sarif_file: devskim-results.sarif
