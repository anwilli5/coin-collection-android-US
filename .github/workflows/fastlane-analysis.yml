# https://github.com/marketplace/actions/validate-fastlane-supply-metadata

name: Fastlane Metadata

on:
  push:
    branches: [ main ]
    paths:
      - 'fastlane/metadata/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'fastlane/metadata/**'

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ashutoshgngwr/validate-fastlane-supply-metadata@c8857fdbbd3e00f9a5cbe8604bcecfa95ce8fef8 # v2.1.0
        with:
          usePlayStoreLocales: true