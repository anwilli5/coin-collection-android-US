name: Promote Pre-release to Release

on:
  workflow_dispatch:
    inputs:
      rc_tag:
        description: 'Pre-release tag to promote (e.g. v3.7.4-rc.1).'
        required: true
        type: string

# Shared with release.yml and deploy.yml, which also upload to the stores;
# see release.yml for why cancel-in-progress is false.
concurrency:
  group: store-release-pipeline
  cancel-in-progress: false

permissions:
  contents: read

# Order matters: the store deploys run first and the final GitHub Release (and
# its bare vX.Y.Z tag, which F-Droid watches) is created last, so a store
# failure never leaves F-Droid and GitHub announcing a release the stores never
# got. Each stage is its own job so a failure is recoverable with "Re-run failed
# jobs": that re-runs only the failed job and the ones after it. Neither store
# step is safe to repeat once it has succeeded (Play promotes by versionCode,
# Amazon opens a new edit and re-uploads), so do not re-dispatch the workflow
# after a partial failure.
jobs:
  prepare:
    name: 'Validate pre-release'
    runs-on: ubuntu-latest
    outputs:
      rc_tag: ${{ steps.parse.outputs.rc_tag }}
      version_name: ${{ steps.parse.outputs.version_name }}
      final_tag: ${{ steps.parse.outputs.final_tag }}
      commit_sha: ${{ steps.resolve.outputs.commit_sha }}
      version_code: ${{ steps.resolve.outputs.version_code }}
      already_released: ${{ steps.state.outputs.already_released }}
    steps:
      - name: Validate and parse RC tag
        id: parse
        env:
          INPUT_RC_TAG: ${{ github.event.inputs.rc_tag }}
        run: |
          set -euo pipefail
          RC_TAG="$INPUT_RC_TAG"
          # Only accept a proper pre-release tag: vMAJOR[.MINOR...]-rc.N. Use
          # bash's [[ =~ ]] rather than grep, which matches line by line and
          # would accept a value with an embedded newline.
          if ! [[ "$RC_TAG" =~ ^v[0-9]+(\.[0-9]+)*-rc\.[0-9]+$ ]]; then
            echo "Error: rc_tag '$RC_TAG' is not of the form vX.Y.Z-rc.N."
            exit 1
          fi
          VERSION_NAME="$(printf '%s' "$RC_TAG" | sed -E 's/^v//; s/-rc\.[0-9]+$//')"
          FINAL_TAG="v${VERSION_NAME}"
          echo "rc_tag=$RC_TAG" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "final_tag=$FINAL_TAG" >> "$GITHUB_OUTPUT"
          echo "Parsed: rc_tag=$RC_TAG versionName=$VERSION_NAME final_tag=$FINAL_TAG"

      - name: Checkout RC tag commit
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.parse.outputs.rc_tag }}
          fetch-depth: 0 # All tags, to check where an existing final tag points

      - name: Resolve commit and versionCode
        id: resolve
        run: |
          set -euo pipefail
          COMMIT_SHA="$(git rev-parse HEAD)"
          VERSION_PROPS_PATH="version.properties"
          if [ ! -f "$VERSION_PROPS_PATH" ]; then
            echo "$VERSION_PROPS_PATH not found at ${{ steps.parse.outputs.rc_tag }}. Pre-release tags cut before the version moved out of AndroidManifest.xml cannot be promoted by this workflow."
            exit 1
          fi
          VERSION_CODE=$(grep -E '^versionCode=' "$VERSION_PROPS_PATH" | cut -d= -f2- | tr -d '[:space:]')
          if [ -z "$VERSION_CODE" ]; then
            echo "Could not extract versionCode from $VERSION_PROPS_PATH at ${{ steps.parse.outputs.rc_tag }}"
            exit 1
          fi
          echo "commit_sha=$COMMIT_SHA" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "Commit: $COMMIT_SHA versionCode: $VERSION_CODE"

      - name: Verify checked-in release notes exist
        # Production/Amazon "what's new" text comes from the release notes checked
        # into the repo at fastlane/metadata/android/en-US/changelogs/<versionCode>.txt
        # (as of the RC tag commit checked out above). No pre-release notice is
        # prepended for the production release.
        run: |
          set -euo pipefail
          VC="${{ steps.resolve.outputs.version_code }}"
          NOTES_FILE="fastlane/metadata/android/en-US/changelogs/${VC}.txt"
          if [ ! -s "$NOTES_FILE" ]; then
            echo "::error::Release notes file $NOTES_FILE is missing or empty at ${{ steps.parse.outputs.rc_tag }}. Add it (checked in) before promoting."
            exit 1
          fi
          echo "Using release notes from $NOTES_FILE:"
          echo "----------------------------------------"
          cat "$NOTES_FILE"
          echo "----------------------------------------"
          CHARS=$(wc -m < "$NOTES_FILE" | tr -d ' ')
          if [ "$CHARS" -gt 500 ]; then
            echo "::warning::Release notes are ${CHARS} characters; Google Play truncates 'what's new' at 500."
          fi

      - name: Verify pre-release assets and final release state
        # Everything the later jobs need is checked here, before either store is
        # touched: the release job runs last, so a missing asset or a final tag
        # pointing at the wrong commit must not surface only after both stores
        # have shipped.
        id: state
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          RC_TAG="${{ steps.parse.outputs.rc_tag }}"
          FINAL_TAG="${{ steps.parse.outputs.final_tag }}"
          VERSION_NAME="${{ steps.parse.outputs.version_name }}"
          COMMIT_SHA="${{ steps.resolve.outputs.commit_sha }}"

          if ! ASSETS="$(gh release view "$RC_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"; then
            echo "Error: pre-release $RC_TAG not found. Run the 'Build and Publish Pre-release' workflow first."
            exit 1
          fi
          for NAME in \
            "app-android-release-v${VERSION_NAME}.apk" \
            "app-amazon-release-v${VERSION_NAME}.apk" \
            "mapping-android-release-v${VERSION_NAME}.txt" \
            "mapping-amazon-release-v${VERSION_NAME}.txt"; do
            if ! grep -qxF "$NAME" <<< "$ASSETS"; then
              echo "Error: pre-release $RC_TAG has no $NAME asset."
              exit 1
            fi
          done

          # A final tag may exist only if it points at the RC commit: the release
          # job would otherwise fail after the stores had already shipped.
          if TAG_SHA="$(git rev-parse -q --verify "refs/tags/${FINAL_TAG}^{commit}")"; then
            if [ "$TAG_SHA" != "$COMMIT_SHA" ]; then
              echo "Error: tag $FINAL_TAG already exists at $TAG_SHA, not at the $RC_TAG commit $COMMIT_SHA."
              exit 1
            fi
          fi

          # The final release is created only after both store deploys succeed,
          # so if it already exists (at the RC commit, checked above) this
          # version is fully promoted and there is nothing left to do.
          if gh release view "$FINAL_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::notice::Final release $FINAL_TAG already exists at the $RC_TAG commit, so this pre-release was already promoted. Skipping the store deploys and release creation. To redeploy one store, use the 'Deploy Release to App Stores' workflow."
            echo "already_released=true" >> "$GITHUB_OUTPUT"
          else
            echo "Pre-release $RC_TAG has all assets; final release $FINAL_TAG not yet created."
            echo "already_released=false" >> "$GITHUB_OUTPUT"
          fi

  play:
    name: 'Google Play production'
    needs: prepare
    if: needs.prepare.outputs.already_released == 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout RC tag commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.commit_sha }}

      - name: Set up Ruby for Fastlane
        uses: ruby/setup-ruby@v1
        with:
          # Ruby version defined in .ruby-version
          bundler-cache: true

      - name: Create Google Play Key File
        env:
          GOOGLE_PLAY_JSON_KEY_DATA: ${{ secrets.GOOGLE_PLAY_JSON_KEY_DATA }}
        run: |
          if [ -z "$GOOGLE_PLAY_JSON_KEY_DATA" ]; then
            echo "Error: GOOGLE_PLAY_JSON_KEY_DATA secret is not set."
            exit 1
          fi
          printf '%s' "$GOOGLE_PLAY_JSON_KEY_DATA" > /tmp/google_play_key.json
          python3 -c 'import json,sys; json.load(open("/tmp/google_play_key.json"))' || {
            echo "Error: GOOGLE_PLAY_JSON_KEY_DATA did not parse as JSON.";
            exit 1;
          }

      - name: Deploy to Google Play (Production)
        run: |
          VERSION_NAME="${{ needs.prepare.outputs.version_name }}"
          # Promote the release already uploaded to the internal track by the
          # pre-release workflow (keyed off versionCode) — Google Play forbids
          # re-uploading an already-published APK, so no apk_path is passed.
          # Release notes come from the checked-in changelog file for this
          # versionCode.
          bundle exec fastlane deploy_playstore_production \
            version_name:"${VERSION_NAME}" \
            version_code:"${{ needs.prepare.outputs.version_code }}"

  amazon:
    name: 'Amazon Appstore'
    needs: [prepare, play]
    if: needs.prepare.outputs.already_released == 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout RC tag commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.commit_sha }}

      - name: Download Amazon APK from pre-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          AMAZON_APK_NAME="app-amazon-release-v${{ needs.prepare.outputs.version_name }}.apk"
          gh release download "${{ needs.prepare.outputs.rc_tag }}" \
            --pattern "$AMAZON_APK_NAME" \
            --dir downloaded_apks \
            --repo "$GITHUB_REPOSITORY"
          if [ ! -s "downloaded_apks/$AMAZON_APK_NAME" ]; then
            echo "Error: failed to download $AMAZON_APK_NAME"
            exit 1
          fi

      - name: Set up Ruby for Fastlane
        uses: ruby/setup-ruby@v1
        with:
          # Ruby version defined in .ruby-version
          bundler-cache: true

      - name: Deploy to Amazon Appstore
        env:
          AMAZON_CLIENT_ID: ${{ secrets.AMAZON_CLIENT_ID }}
          AMAZON_CLIENT_SECRET: ${{ secrets.AMAZON_CLIENT_SECRET }}
        run: |
          VERSION_NAME="${{ needs.prepare.outputs.version_name }}"
          bundle exec fastlane deploy_amazon_appstore \
            apk_path:"${{ github.workspace }}/downloaded_apks/app-amazon-release-v${VERSION_NAME}.apk" \
            version_name:"${VERSION_NAME}" \
            version_code:"${{ needs.prepare.outputs.version_code }}"

  release:
    name: 'Final GitHub Release (F-Droid tag)'
    needs: [prepare, play, amazon]
    if: needs.prepare.outputs.already_released == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the final release and tag
    steps:
      - name: Download APKs and R8 mapping files from pre-release
        # Re-attach the exact APKs internal testers verified, plus their
        # obfuscation mappings. R8 names are not reproducible, so the mappings
        # cannot be regenerated by rebuilding the tag — without them a crash
        # trace from a shipped build (GitHub issue, F-Droid) cannot be
        # deobfuscated. See release.yml for where they are produced.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          RC_TAG="${{ needs.prepare.outputs.rc_tag }}"
          VERSION_NAME="${{ needs.prepare.outputs.version_name }}"
          mkdir -p downloaded_assets
          for NAME in \
            "app-android-release-v${VERSION_NAME}.apk" \
            "app-amazon-release-v${VERSION_NAME}.apk" \
            "mapping-android-release-v${VERSION_NAME}.txt" \
            "mapping-amazon-release-v${VERSION_NAME}.txt"; do
            gh release download "$RC_TAG" \
              --pattern "$NAME" \
              --dir downloaded_assets \
              --repo "$GITHUB_REPOSITORY"
            if [ ! -s "downloaded_assets/$NAME" ]; then
              echo "Error: failed to download $NAME"
              exit 1
            fi
          done
          ls -la downloaded_assets/

      - name: Create final GitHub Release (F-Droid picks up this tag)
        uses: softprops/action-gh-release@v3
        with:
          # The bare vX.Y.Z tag is what F-Droid's UpdateCheckMode watches. It is
          # created here, after both stores accepted the build, and points at
          # the exact commit the verified pre-release APKs were built from.
          tag_name: ${{ needs.prepare.outputs.final_tag }}
          target_commitish: ${{ needs.prepare.outputs.commit_sha }}
          name: Release ${{ needs.prepare.outputs.final_tag }}
          files: |
            downloaded_assets/app-android-release-v${{ needs.prepare.outputs.version_name }}.apk
            downloaded_assets/app-amazon-release-v${{ needs.prepare.outputs.version_name }}.apk
            downloaded_assets/mapping-android-release-v${{ needs.prepare.outputs.version_name }}.txt
            downloaded_assets/mapping-amazon-release-v${{ needs.prepare.outputs.version_name }}.txt
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
