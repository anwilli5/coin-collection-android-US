# This workflow will build a Java project with Gradle
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-gradle

name: Android CI

# paths-ignore skips this workflow entirely for docs/image/metadata-only
# changes, so its "test" check never reports on such PRs. If "test" is ever made
# a required check, those PRs will wait on it forever: drop the paths-ignore
# lists then, or add a job that reports success when nothing relevant changed.
on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**/*.md'
      - 'images/**'
      - 'fastlane/metadata/**'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**/*.md'
      - 'images/**'
      - 'fastlane/metadata/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Java Setup
      uses: actions/setup-java@v6.0.1
      with:
        # JDK version is single-sourced from the repo-root .java-version file.
        java-version-file: .java-version
        distribution: 'temurin'
    - name: Gradle Setup
      # Caches the Gradle wrapper and dependencies; only main writes the cache
      uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Unit Test
      # No --rerun-tasks: each run starts from a clean checkout with no build
      # cache, so the tests always execute
      run: ./gradlew testAndroidDebugUnitTest
    - name: Lint
      run: ./gradlew lintAndroidDebug
    - name: Compile Amazon flavor
      # The steps above only build the android flavor; catch amazon-only
      # compile breaks before release.yml builds its APK.
      run: ./gradlew compileAmazonDebugSources
    - name: Coverage
      # Reads the coverage of the Unit Test run above (the tests aren't rerun)
      # and fails below the floors set in app/build.gradle
      run: ./gradlew checkAndroidDebugUnitTestCoverage
    - name: Upload coverage report
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v7
      with:
        name: unit-test-coverage
        path: app/build/reports/coverage/test/android/debug/
        if-no-files-found: ignore
