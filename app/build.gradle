plugins {
    id 'com.android.application'
}

// The app version is single-sourced from the repo-root version.properties,
// shared with the three release workflows. Read it through providers.fileContents
// so the file is a tracked configuration input (the configuration cache is
// enabled in gradle.properties).
def versionProps = new Properties()
versionProps.load(new StringReader(
        providers.fileContents(rootProject.layout.projectDirectory.file('version.properties'))
                .asText.get()))
def appVersionCode = versionProps.getProperty('versionCode').trim().toInteger()
def appVersionName = versionProps.getProperty('versionName').trim()

android {
    signingConfigs {
        Android {
            // Local development: read from signing.properties (gitignored) when present.
            def signingPropsFile = new File('../signing.properties')
            // CI: when SIGNING_* env vars are set (see .github/workflows/release.yml),
            // use them instead. Env vars take precedence over signing.properties.
            def envKeystorePath = System.getenv('SIGNING_KEYSTORE_PATH')
            def envKeystorePassword = System.getenv('SIGNING_KEYSTORE_PASSWORD')
            def envKeyAlias = System.getenv('SIGNING_KEY_ALIAS')
            def envKeyPassword = System.getenv('SIGNING_KEY_PASSWORD')
            if (envKeystorePath && envKeystorePassword && envKeyAlias && envKeyPassword) {
                storeFile = file(envKeystorePath)
                storePassword = envKeystorePassword
                keyAlias = envKeyAlias
                keyPassword = envKeyPassword
            } else if (signingPropsFile.canRead()) {
                def props = new Properties()
                def fileInputStream = new FileInputStream(signingPropsFile)
                props.load(fileInputStream)
                fileInputStream.close()
                storeFile = file(props['storeFilePath'])
                storePassword = props['storePassword']
                keyAlias = props['keyAlias']
                keyPassword = props['keyPassword']
            }
        }
    }
    compileSdk = 37
    // minSdkVersion should be the lowest supported.
    //  - For app versions 1.6 and below this was 4
    //  - Raised to 7 for version 2.0 to support the appcompat support library
    //    so we could use ActionBars
    //  - Raised to ?? for version 2.2.1 to get the recyclerview (for the
    //    view to reorder collections
    //  - Raised to 14 for version 2.3.4 since appcompat's min SDK increased to that
    // targetSdkVersion should be raised to match the latest version of
    // Android and then tested (on that version) to make sure it works.
    defaultConfig {
        applicationId = "com.spencerpages"
        minSdk = 21
        targetSdk = 37
        versionCode = appVersionCode
        versionName = appVersionName
        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
    }
    buildTypes {
        release {
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.txt'
            // Apply the release signing config only when it was actually populated
            // (either via env vars in CI or signing.properties locally). Without this
            // guard, Gradle would fail evaluating a signingConfig with a null
            // storeFile. With it, a local build with no keystore configured simply
            // produces an unsigned release APK (CI always provides the keystore).
            if (signingConfigs.Android.storeFile != null) {
                signingConfig = signingConfigs.Android
            }
        }
        debug {
            applicationIdSuffix = ".debug"
            debuggable = true
            // Unit-test runs record JaCoCo coverage, checked by
            // checkAndroidDebugUnitTestCoverage below
            enableUnitTestCoverage = true
        }
    }
    flavorDimensions = ["version"]
    productFlavors {
        android {
            dimension = "version"
        }
        amazon {
            dimension = "version"
            applicationIdSuffix = ".amazon"
            // TODO - Up-rev once Amazon's SDK adds support
            targetSdk = 35
        }
    }
    lint {
        abortOnError = true
        warningsAsErrors = true
        // Newer-version notices depend on upstream releases, not on this code,
        // and would fail unrelated PRs; Dependabot tracks version bumps instead.
        // Coin images intentionally ship in drawable-mdpi only.
        disable += ['GradleDependency', 'NewerVersionAvailable',
                    'AndroidGradlePluginVersion', 'IconDensities']
    }
    namespace = 'com.spencerpages'
    buildFeatures {
        buildConfig = true
    }
    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.all {
            testLogging {
                events 'passed', 'skipped', 'failed', 'standardOut', 'standardError'
                exceptionFormat "full"
                showExceptions = true
                showCauses = true
                showStackTraces = true
                showStandardStreams = true
            }
            // Load Mockito as an explicit Java agent instead of relying on its
            // inline mock maker self-attaching at runtime. Self-attach is fragile
            // on JDK 21+ (and fails outright on some JVMs, e.g. the JetBrains
            // Runtime used in CI), which caused Mockito to break for the rest of
            // the forked JVM once another test polluted its state.
            jvmArgs "-javaagent:${configurations.mockitoAgent.asPath}", '-XX:+EnableDynamicAgentLoading'
            // Robolectric 4.17 sets raw FileDescriptor fields through
            // jdk.internal.access.SharedSecrets, which java.base doesn't export
            jvmArgs '--add-opens=java.base/jdk.internal.access=ALL-UNNAMED'
            // -PupdateGoldens rewrites the CollectionGoldenTests fixtures
            systemProperty 'updateGoldens', project.hasProperty('updateGoldens')
            // Where that and the fixture generators write back to; tests read
            // the fixtures from the classpath (see sourceSets below)
            systemProperty 'testDataSourceDir', file('src/test/data').absolutePath
            // Robolectric loads the app's classes itself, without a code
            // source, and JaCoCo skips such classes unless told otherwise.
            // Instrument only the app's packages: the Android classes
            // Robolectric loads the same way would make the tests ~5x slower
            jacoco {
                includeNoLocationClasses = true
                includes = ['com.coincollection.*', 'com.spencerpages.*']
            }
        }
    }
    sourceSets {
        // Unit-test fixtures, loaded with getResourceAsStream() so the tests
        // don't depend on the working directory
        test.resources.srcDir 'src/test/data'
    }
    dependenciesInfo {
        // Disables dependency metadata when building APKs.
        includeInApk = false
        // Disables dependency metadata when building Android App Bundles.
        includeInBundle = false
    }
    packagingOptions {
        resources {
            merges += ['META-INF/LICENSE.md', 'META-INF/LICENSE-notice.md']
        }
    }
}

// Name every APK app-<flavor>-<buildType>-v<versionName>.apk. This applies to
// debug as well as release: fastlane/Fastfile and release.yml both look up APKs
// by that exact name.
androidComponents {
    onVariants(selector().all()) { variant ->
        variant.outputs.each { output ->
            output.outputFileName.set(
                    "app-${variant.flavorName}-${variant.buildType}-v${appVersionName}.apk")
        }
    }
}

// Coverage gate for the unit tests, run by gradle.yml. Raise the floors as
// coverage grows; don't lower them to get a change through.
def coverageFloors = [LINE: 0.88, BRANCH: 0.85]
tasks.register('checkAndroidDebugUnitTestCoverage') {
    group = 'verification'
    description = 'Fails if unit-test line or branch coverage is below its floor.'
    inputs.files(tasks.named('createAndroidDebugUnitTestCoverageReport'))
    inputs.property('floors', coverageFloors)
    doLast { task ->
        def reportXml = task.inputs.files.asFileTree.matching { include '**/report.xml' }.singleFile
        // JaCoCo reports declare a DTD; allow the declaration but never fetch it
        def slurper = new groovy.xml.XmlSlurper(false, false, true)
        slurper.setFeature('http://apache.org/xml/features/nonvalidating/load-external-dtd', false)
        def report = slurper.parse(reportXml)
        def failures = []
        coverageFloors.each { type, floor ->
            // The report's own counters are the totals; packages nest theirs
            def counter = report.counter.find { it.@type == type }
            def covered = counter.@covered.toInteger()
            def total = covered + counter.@missed.toInteger()
            def summary = String.format('%s coverage %.2f%% (floor %.0f%%)',
                    type, 100.0 * covered / total, 100.0 * floor)
            task.logger.lifecycle(summary)
            if (covered < floor * total) {
                failures << summary
            }
        }
        if (failures) {
            throw new GradleException("Unit-test coverage is below its floor:\n  "
                    + failures.join('\n  ') + "\nReport: ${reportXml.parentFile}/index.html")
        }
    }
}

configurations {
    // Resolves the Mockito jar so it can be passed to the test JVM as a
    // -javaagent (see testOptions above).
    mockitoAgent
    configureEach {
        exclude module: 'commons-logging'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'com.opencsv:opencsv:5.12.0'
    implementation(platform("org.jetbrains.kotlin:kotlin-bom:2.4.20"))
    //debugImplementation 'com.squareup.leakcanary:leakcanary-android:2.6'
    testImplementation(project(":shared-test"))
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.17'
    testImplementation 'androidx.test:core:1.7.0'
    testImplementation 'org.mockito:mockito-core:5.24.0'
    mockitoAgent('org.mockito:mockito-core:5.24.0') { transitive = false }
    androidTestImplementation(project(":shared-test"))
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    androidTestImplementation 'androidx.test.espresso:espresso-contrib:3.7.0'
    androidTestImplementation 'androidx.test.espresso:espresso-intents:3.7.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test:rules:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.4.0'
    androidTestImplementation 'tools.fastlane:screengrab:2.1.1'
}